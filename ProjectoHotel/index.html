<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel - Registro de Reservaciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">

<div class="container py-4">
    
    <div class="row shadow-lg rounded-4 overflow-hidden bg-white">
        
        <!-- Columna Izquierda -->
        <main class="col-lg-7 p-5 d-flex flex-column justify-content-center">
            <h2 class="mb-4 text-primary fw-bold">Registro de Reservación de Hotel</h2>
            <form id="formReservacion">
                
                <!-- Sección de Datos Personales -->
                <section class="mb-3">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="rfc" class="form-label fw-semibold">RFC:</label>
                            <input type="text" id="rfc" class="form-control" placeholder="Ingrese el RFC" maxlength="13" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="nombre" class="form-label fw-semibold">Nombre del cliente:</label>
                            <input type="text" id="nombre" class="form-control" placeholder="Ingrese el nombre" maxlength="100" required>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6">
                            <label for="ninos" class="form-label fw-semibold">Cantidad de niños:</label>
                            <input type="number" id="ninos" class="form-control" min="0" value="0">
                        </div>
                        <div class="col-md-6">
                            <label for="adultos" class="form-label fw-semibold">Cantidad de adultos:</label>
                            <input type="number" id="adultos" class="form-control" min="1" value="1">
                        </div>
                    </div>
                </section>
                
                <hr class="my-4">
                
                <!-- Sección de Selección de Habitaciones -->
                <section class="mb-4">
                    <label for="habitacion" class="form-label fw-semibold">Selecciona una Habitación:</label>
                    <div class="input-group mb-3">
                        <select id="habitacion" class="form-select">
                            <option value="H. Sencilla|1200|2">H. Sencilla ($1200) - 2 Ind - 2 ps</option>
                            <option value="H. Doble|1700|3">H. Doble ($1700) - 1 Mat 1 Ind - 3 ps</option>
                            <option value="H. Familiar|2500|4">H. Familiar ($2500) - 2 Mat - 4 ps</option>
                            <option value="H. Suite|2800|5">H. Suite ($2800) - 2 Mat 1 Ind - 5 ps</option>
                            <option value="P. Extra|500|1">Costo Extra ($500) - sin adicionales - 1 ps</option>
                        </select>
                        <button type="button" class="btn btn-outline-primary" onclick="agregarHabitacion();">+ Añadir</button>
                    </div>
                    
                    <h5 class="mt-4 text-secondary">Habitaciones agregadas:</h5>
                    <ul id="listaHabitaciones" class="list-group mb-4"></ul>
                </section>
                
                <button type="button" class="btn btn-primary w-100 py-2 fw-bold shadow-sm" onclick="procesarEnviar();">Calcular y Generar Ticket</button>
            </form>
        </main>

        
        <div class="col-lg-5 d-none d-lg-block p-0 position-relative">
            <img src="https://images.unsplash.com/photo-1618773928121-c32242e63f39?auto=format&fit=crop&w=800&q=80" alt="Habitación de Hotel" class="w-100 h-100 object-fit-cover">
        </div>

    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="funciones.js"></script>
</body>
</html>
