<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket de Reservación - Hotel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">

<div class="container py-4">
    <div class="row shadow-lg rounded-4 overflow-hidden bg-white justify-content-center">
        
        <!-- Columna Izquierda -->
        <div class="col-lg-5 d-none d-lg-block p-0 position-relative">
            <img src="https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=800&q=80" alt="Hotel Exterior" class="w-100 h-100 object-fit-cover">
        </div>

        <!-- Columna Derecha -->
        <div class="col-lg-7 p-5 d-flex flex-column justify-content-center">
            <h2 class="mb-4 text-success fw-bold">Comprobante de Reservación</h2>
            
            <div class="card bg-light border-0 p-3 mb-3">
                <p class="mb-1"><strong>RFC:</strong> <span id="salidaRfc" class="text-muted">---</span></p>
                <p class="mb-1"><strong>Cliente:</strong> <span id="salidaCliente" class="text-muted">---</span></p>
                <p class="mb-0"><strong>Huéspedes:</strong> <span id="salidaHuespedes" class="text-muted">---</span></p>
            </div>
            
            <h5 class="text-secondary mt-2">Reservación de Hospedaje:</h5>
            <ul id="salidaListaHabitaciones" class="list-group mb-3"></ul>
            
            <div class="d-flex justify-content-between align-items-center border-top pt-3 mb-2">
                <span class="fw-semibold">Subtotal Hospedaje:</span>
                <span id="salidaSubtotal" class="fs-5">$0.00</span>
            </div>
            
            <div class="alert alert-success d-flex justify-content-between align-items-center mt-3">
                <span class="fw-bold fs-5">Total a Pagar:</span>
                <span id="salidaTotal" class="fw-bold fs-4">$0.00</span>
            </div>
        </div>

    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="funciones.js"></script>
</body>
</html>
