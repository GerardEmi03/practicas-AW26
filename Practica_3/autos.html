  <meta charset="UTF-8">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <link rel="stylesheet" href="stilo.css">

<body>

  <header class="encabezado-sitio">
    <span class="material-symbols-outlined">directions_car</span>
    <h1>Gestión de Autos</h1>
  </header>

  <section class="contenedor-estructura">
    
    <main class="contenido-principal">
      <h2>Autos</h2>

      <form class="formulario-estandar" onsubmit="guardarAuto(event)">
        <section class="grupo-campo">
          <label for="modelo">Modelo</label>
          <input type="text" id="modelo" name="modelo" required>
        </section>

        <section class="grupo-campo">
          <label for="color">Color</label>
          <input type="text" id="color" name="color" required>
        </section>

        <section class="grupo-campo">
          <label for="foto">Foto</label>
          <input type="file" id="foto" name="foto">
        </section>

        <section class="grupo-campo">
          <label>Activo</label>
          <article class="opciones-radio">
            <label><input type="radio" name="activo" value="SI" checked> SI</label>
            <label><input type="radio" name="activo" value="NO"> NO</label>
          </article>
        </section>

        <footer class="contenedor-boton">
          <button type="submit">
            <span class="material-symbols-outlined">save</span> Guardar
          </button>
        </footer>
      </form>
    </main>

        </ol>
      </nav>
    </aside>

  </section>

  </footer>

</body>
