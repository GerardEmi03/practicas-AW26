<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corredor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <link rel="stylesheet" href="stilo.css">
</head>
<body>

  <header class="encabezado-sitio">
    <span class="material-symbols-outlined">person</span>
    <h1>Gestión de Corredores</h1>
  </header>

  <section class="contenedor-estructura">
    
    <main class="contenido-principal">
      <h2>Corredor</h2>

      <form class="formulario-estandar" onsubmit="guardarCorredor(event)">
        
        <section class="fila-campos">
          <article class="campo-columna">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required>
          </article>

          <article class="campo-columna">
            <label for="app">App</label>
            <input type="text" id="app" name="app" required>
          </article>

          <article class="campo-columna">
            <label for="apm">Apm</label>
            <input type="text" id="apm" name="apm" required>
          </article>
        </section>

        <section class="fila-campos">
          <article class="grupo-campo">
            <label for="edad">Edad</label>
            <input type="number" id="edad" name="edad" min="1" max="100" required>
          </article>

          <article class="grupo-campo">
            <label>Género</label>
            <article class="opciones-radio">
              <label><input type="radio" name="genero" value="F" checked> F</label>
              <label><input type="radio" name="genero" value="M"> M</label>
            </article>
          </article>
        </section>

        <section class="grupo-campo">
          <label for="foto">Foto</label>
          <input type="file" id="foto" name="foto">
        </section>

        <footer class="contenedor-boton">
          <button type="submit">
            <span class="material-symbols-outlined">save</span> Guardar
          </button>
        </footer>

      </form>
    </main>

      <nav>
        <h3><span class="material-symbols-outlined">menu</span> Menú</h3>

          <li><a href="index.html">Menú principal</a></li>

          <li><a href="corredor.html">Corredor</a></li>
          <li><a href="relaciones.html">Relaciones</a></li>
        </ol>
      </nav>
    </aside>

  </section>

  <footer class="pie-pagina">
    <p>Gerardo Emiliano Cervantes Noriega</p>
    <p>Grupo LDSM405</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
